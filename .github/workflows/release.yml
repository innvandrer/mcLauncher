name: Release

# Builds and publishes a signed release whenever a version tag (v*) is pushed.
# Requires two repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          - full contents of ~/.beacon-signing/beacon.key (one base64 line)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - the key password (leave empty if none)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EZMapa ${{ github.ref_name }}"
          releaseBody: "Download the installer below. Existing installs update automatically."
          releaseDraft: false
          prerelease: false
