name: Release

# Builds and publishes a signed release whenever a version tag (v*) is pushed.
# Requires two repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          - full contents of ~/.beacon-signing/beacon.key (one base64 line)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - the key password (leave empty if none)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Load per-release notes from RELEASE_NOTES.md so the GitHub release body
      # and the in-app updater modal (latest.json `notes`) stay in sync. Edit
      # that file before tagging each release. Falls back to a generic line if
      # the file is missing, so a forgotten edit never fails the release.
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              echo "Download the installer below. Existing installs update automatically."
            fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EZMapa ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # v0.2.5 is a soak-test prerelease (token-storage migration touches
          # every saved login) — set back to false for the next stable tag.
          prerelease: true
