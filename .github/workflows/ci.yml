name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Windows is the platform we ship, and it needs no extra system libraries to
  # compile the Tauri backend (Linux would need webkit2gtk/glib dev packages).
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Also produces dist/, which tauri::generate_context! embeds at compile
      # time — the Rust steps below won't build without it.
      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
