[package]
name = "ezmapa-launcher"
version = "0.3.1"
description = "EZMapa — a modern Minecraft launcher"
authors = ["EZMapa contributors"]
edition = "2021"
# Option::is_none_or (used in instances.rs) requires 1.82.
rust-version = "1.82"

# The library that the Tauri application binds to. The desktop binary in
# `main.rs` simply calls `ezmapa_lib::run()`.
[lib]
name = "ezmapa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "process",
    "io-util",
    "net",
    "sync",
    "time",
] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures = "0.3"

sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

zip = { version = "2", default-features = false, features = ["deflate"] }
# Adoptium ships .tar.gz JRE archives on Linux/macOS (zip is Windows-only).
# Both crates are already in the tree transitively (zip's deflate uses flate2).
flate2 = "1"
tar = "0.4"

thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
dirs = "5"
discord-rich-presence = "1.1.0"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }

# Desktop-only dependencies. NOTE: this table header captures every dependency
# below it, so keep it at the END of the dependency section — putting general
# dependencies after it silently desktop-gates them (mobile builds then fail).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
