[package]
name = "beacon-launcher"
version = "0.1.0"
description = "A modern, open-source Minecraft launcher"
authors = ["Beacon contributors"]
edition = "2021"
rust-version = "1.77"

# The library that the Tauri application binds to. The desktop binary in
# `main.rs` simply calls `beacon_lib::run()`.
[lib]
name = "beacon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "process",
    "io-util",
    "sync",
    "time",
] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

zip = { version = "2", default-features = false, features = ["deflate"] }

thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
dirs = "5"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
